<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Verification Code</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding: 40px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                    
                    <!-- Header -->
                    <tr>
                        <td style="background-color:#4f46e5; padding: 24px; text-align:center;">
                            <h1 style="margin:0; color:#ffffff; font-size:20px; font-weight:600;">
                                Your Verification Code
                            </h1>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding: 32px 24px;">
                            <p style="margin:0 0 16px; color:#333333; font-size:15px; line-height:1.6;">
                                Hi {{ first_name }},
                            </p>

                            <p style="margin:0 0 24px; color:#555555; font-size:15px; line-height:1.6;">
                                Use the code below to sign in to your account. This code will expire in <strong>{{ expiry_duration }} minutes</strong>.
                            </p>

                            <!-- OTP Box -->
                            <div style="text-align:center; margin: 32px 0;">
                                <div style="display:inline-block; padding: 16px 32px; background-color:#f9fafb; border: 2px dashed #d1d5db; border-radius:10px;">
                                    <span style="font-size:32px; font-weight:bold; letter-spacing:8px; color:#4f46e5; font-family: 'Courier New', monospace;">
                                        {{ pass_code }}
                                    </span>
                                </div>
                            </div>

                            <p style="margin:24px 0 0; color:#888888; font-size:13px; line-height:1.6;">
                                If you didn't request this code, you can safely ignore this email.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 24px; background-color:#fafafa; border-top:1px solid #eeeeee;">
                            <p style="margin:0; color:#aaaaaa; font-size:12px; text-align:center;">
                                This is an automated message — please do not reply.
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
